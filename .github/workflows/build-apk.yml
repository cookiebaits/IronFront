name: Build Android APK & iOS App

# Builds a portrait fullscreen debug APK and iOS App bundle, attaching them to the workflow run.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Portrait Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        shell: bash
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the GitHub runner" >&2
            exit 1
          fi

          if [ -x "$SDKMANAGER" ]; then
            SDKMANAGER_RUN=("$SDKMANAGER")
          else
            SDKMANAGER_RUN=(bash "$SDKMANAGER")
          fi
          timeout 5m bash -c "yes | bash '$SDKMANAGER' --licenses >/dev/null" || true

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          PACKAGES=()
          [ -d "$SDK_ROOT/platform-tools" ] || PACKAGES+=("platform-tools")
          [ -d "$SDK_ROOT/platforms/android-36" ] || PACKAGES+=("platforms;android-36")
          [ -d "$SDK_ROOT/build-tools/36.0.0" ] || PACKAGES+=("build-tools;36.0.0")
          if [ ${#PACKAGES[@]} -gt 0 ]; then
            echo "Installing missing Android packages: ${PACKAGES[*]}"
            timeout 10m "${SDKMANAGER_RUN[@]}" --install "${PACKAGES[@]}" \
              || timeout 10m "${SDKMANAGER_RUN[@]}" --install "${PACKAGES[@]}"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"

      - name: Install Python Pillow for Icon Generation
        shell: bash
        run: pip3 install --break-system-packages pillow || pip3 install pillow || true

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        timeout-minutes: 10
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --no-audit --no-fund --prefer-offline

      - name: Build web game
        timeout-minutes: 10
        run: npm run build

      - name: Create Capacitor Android project
        timeout-minutes: 10
        run: |
          if [ -d android ]; then
            echo "android/ already exists"
          else
            npx cap add android
          fi

      - name: Sync Capacitor assets & Tank Icons
        run: |
          python3 scripts/generate_app_icons.py
          npx cap sync android

      - name: Cache and configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Configure Gradle and Debug Key
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle" "$HOME/.android"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          KEYSTORE="$PWD/scripts/debug.keystore"
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Iron Front,C=US"
          fi
          cp "$KEYSTORE" "$HOME/.android/debug.keystore"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Portrait APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/patch-android.py portrait
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          cd ..
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$BUILD_TOOLS/apksigner" sign --ks scripts/debug.keystore \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK"
          cp "$APK" iron-front-tactics.apk

      - name: Upload installable Portrait APK
        uses: actions/upload-artifact@v6
        with:
          name: iron-front-apk
          path: iron-front-tactics.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS App Project
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Python Pillow for Icon Generation
        shell: bash
        run: pip3 install --break-system-packages pillow || pip3 install pillow || true

      - name: Install JavaScript dependencies
        timeout-minutes: 10
        run: npm install --no-audit --no-fund

      - name: Build web game
        timeout-minutes: 10
        run: npm run build

      - name: Create and Sync Capacitor iOS Project
        timeout-minutes: 10
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          python3 scripts/generate_app_icons.py
          npx cap sync ios

      - name: Build iOS App with Xcode
        shell: bash
        run: |
          set -euxo pipefail
          cd ios/App
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi
          cd ../..
          zip -r iron-front-ios-project.zip ios/

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v6
        with:
          name: iron-front-ios
          path: iron-front-ios-project.zip
          if-no-files-found: error
          retention-days: 30
