name: Build Android APK

# Builds a landscape, fullscreen debug APK and attaches it to the workflow run.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# A new push supersedes an older APK build on the same branch instead of letting both
# compete for runner/network time.
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    # Pin the runner image so the announced ubuntu-latest -> Ubuntu 26 migration
    # cannot change the Android toolchain underneath this workflow.
    runs-on: ubuntu-24.04
    # First-time Android/Gradle dependency downloads can exceed 30 minutes on a cold runner.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # There is intentionally no committed package-lock.json.
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        shell: bash
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the GitHub runner" >&2
            exit 1
          fi

          # GitHub's preinstalled SDK can be mounted read-only. Do not chmod files in it.
          # sdkmanager is normally executable; if not, invoke the readable shell script via bash.
          if [ -x "$SDKMANAGER" ]; then
            SDKMANAGER_RUN=("$SDKMANAGER")
          else
            echo "sdkmanager is readable but not executable; invoking it with bash"
            SDKMANAGER_RUN=(bash "$SDKMANAGER")
          fi
          ls -l "$SDKMANAGER"
          timeout 5m bash -c "yes | bash '$SDKMANAGER' --licenses >/dev/null" || true

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          PACKAGES=()
          [ -d "$SDK_ROOT/platform-tools" ] || PACKAGES+=("platform-tools")
          [ -d "$SDK_ROOT/platforms/android-36" ] || PACKAGES+=("platforms;android-36")
          [ -d "$SDK_ROOT/build-tools/36.0.0" ] || PACKAGES+=("build-tools;36.0.0")
          if [ ${#PACKAGES[@]} -gt 0 ]; then
            echo "Installing missing Android packages: ${PACKAGES[*]}"
            # Retry once for transient Google repository/network failures.
            timeout 10m "${SDKMANAGER_RUN[@]}" --install "${PACKAGES[@]}" \
              || timeout 10m "${SDKMANAGER_RUN[@]}" --install "${PACKAGES[@]}"
          else
            echo "Android SDK 36 packages already present on the runner"
          fi

          # sdkmanager may install platform-tools without adding it to PATH for later steps.
          # Persist the resolved SDK paths through GitHub's environment files.
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          # These are required to compile. ADB itself is not required to build the APK.
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          ls -la "$SDK_ROOT/platform-tools" | head -n 20

      - name: Print toolchain versions
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          npm --version
          java --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # ADB is useful for local installation, but it is not part of APK compilation.
          # Print it when available without failing the workflow when PATH propagation differs.
          if command -v adb >/dev/null 2>&1; then
            adb --version
          elif [ -x "$ANDROID_HOME/platform-tools/adb" ]; then
            "$ANDROID_HOME/platform-tools/adb" --version
          else
            echo "NOTICE: adb is unavailable; continuing because APK compilation does not require adb"
          fi

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install JavaScript dependencies
        timeout-minutes: 10
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --no-audit --no-fund --prefer-offline

      - name: Build web game
        timeout-minutes: 10
        run: npm run build

      - name: Create Capacitor Android project
        timeout-minutes: 10
        run: |
          if [ -d android ]; then
            echo "android/ already exists"
          else
            npx cap add android
          fi

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Cache and configure Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Configure Gradle and Debug Key
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle" "$HOME/.android"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Iron Front,C=US"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Landscape APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/patch-android.py landscape
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          cd ..
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK"
          cp "$APK" iron-front-landscape.apk

      - name: Build Portrait APK
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/patch-android.py portrait
          npx cap sync android
          cd android
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          cd ..
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK"
          cp "$APK" iron-front-portrait.apk

      - name: Upload installable APKs
        uses: actions/upload-artifact@v6
        with:
          name: iron-front-apks
          path: |
            iron-front-landscape.apk
            iron-front-portrait.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle log if the build failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-diagnostics
          path: |
            gradle-build.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
