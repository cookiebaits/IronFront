name: Build Android APK

# Builds a landscape, fullscreen debug APK and attaches it to the workflow run.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    # Pin the runner image so the announced ubuntu-latest -> Ubuntu 26 migration
    # cannot change the Android toolchain underneath this workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # There is intentionally no committed package-lock.json.
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the GitHub runner" >&2
            exit 1
          fi
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Print toolchain versions
        run: |
          node --version
          npm --version
          java --version
          adb --version

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web game
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          if [ -d android ]; then
            echo "android/ already exists; syncing it instead of adding it again"
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Force landscape and immersive fullscreen
        run: python3 scripts/patch-android.py

      - name: Build APK with Gradle
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee ../gradle-build.log

      - name: Copy APK with friendly filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk iron-front-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: iron-front-debug-apk
          path: iron-front-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle log if the build failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-diagnostics
          path: |
            gradle-build.log
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14